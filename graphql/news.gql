query AllNews($first: IntType = 100, $skip: IntType = 0) {
	allNews(first: $first, skip: $skip, orderBy: [_firstPublishedAt_DESC]) {
		...NewsLightFragment
	}
	_allNewsMeta {
		count
	}
	allPresses(first: $first, skip: $skip, orderBy: [_firstPublishedAt_DESC]) {
		...PressLightFragment
	}
	_allPressesMeta {
		count
	}
	presskit {
		zip {
			url
		}
	}
}

query News($slug: String) {
	news(filter: { slug: { eq: $slug } }) {
		...NewsFragment
	}
}

fragment NewsFragment on NewsRecord {
	id
	slug
	title
	image {
		...ImageFragment
	}
	intro {
		blocks
		links
		value
	}
	contentWrapper {
		id
		headerLight
		content {
			__typename
			blocks {
				__typename
				... on ButtonRecord {
					id
					text
					url
				}
				... on ExpandableListRecord {
					id
					items {
						__typename
						... on ExpandableListItemRecord {
							id
							title
							text {
								blocks
								links
								value
							}
						}
					}
				}
				... on ImageRecord {
					id
					image {
						...ImageFragment
					}
				}
				... on VideoExternalRecord {
					id
					caption
					video {
						height
						width
						url
						provider
						providerUid
						title
						thumbnailUrl
					}
				}
				... on VideoInternalRecord {
					id
					file {
						...VideoFragment
					}
					caption
				}
			}
			links
			value
		}
	}

	_firstPublishedAt
}

